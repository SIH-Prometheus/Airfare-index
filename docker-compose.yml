# version: "3.9"

# =============================================================================
# PROMETHEUS MVP — Docker Compose
# Services: postgres, minio, minio-init, backend, frontend
# =============================================================================
#
# Start everything:
#   docker compose up --build
#
# Stop everything:
#   docker compose down
#
# Access:
#   Frontend:   http://localhost:3000
#   Backend:    http://localhost:8000
#   Swagger:    http://localhost:8000/docs
#   MinIO UI:   http://localhost:9001  (minioadmin / minioadmin)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: prometheus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airfare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airfare"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    # ── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: prometheus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── MinIO bucket init ───────────────────────────────────────────────────────
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: prometheus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/airfare-data &&
        echo 'Bucket airfare-data ready'
      "
    restart: "no"
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prometheus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # PostgreSQL — uses Docker service name 'postgres'
      PROMETHEUS_DB_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/airfare
      # MinIO — uses Docker service name 'minio'
      PROMETHEUS_MINIO_ENDPOINT: minio:9000
      PROMETHEUS_MINIO_ACCESS_KEY: minioadmin
      PROMETHEUS_MINIO_SECRET_KEY: minioadmin
      PROMETHEUS_MINIO_BUCKET_RAW: airfare-data
      PROMETHEUS_MINIO_SECURE: "false"
      # CORS — allow browser (localhost:3000) to call the API
      PROMETHEUS_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      # Runtime
      PROMETHEUS_ENV: production
      PROMETHEUS_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      # Mount sample data into the container
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # The browser calls this URL directly — must be localhost, not 'backend'
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: prometheus-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

volumes:
  postgres_data:
  minio_data:
