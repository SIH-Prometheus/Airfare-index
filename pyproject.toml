[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prometheus-apix"
version = "0.1.0"
description = "Real-time Airfare Price Index (APIx) for India — SIH26056"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "SIH26056 Team" }]

dependencies = [
    # --- Web scraping ---
    "playwright==1.44.0",
    "httpx==0.27.0",
    "tenacity==8.2.3",
    "fake-useragent==1.5.1",

    # --- Data models & validation ---
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",

    # --- API layer ---
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "sse-starlette==2.1.0",

    # --- Database ---
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",

    # --- Object storage & file formats ---
    "minio==7.2.7",
    "boto3==1.34.100",
    "pyarrow==16.1.0",

    # --- Cache & message broker ---
    "redis==5.0.4",
    "hiredis==2.3.2",

    # --- Orchestration ---
    "prefect==3.0.0rc20",

    # --- ML & analytics ---
    "scikit-learn==1.5.0",
    "statsmodels==0.14.2",
    "prophet==1.1.5",
    "joblib==1.4.2",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.1",

    # --- Auth ---
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # --- Observability ---
    "structlog==24.2.0",
    "prometheus-client==0.20.0",

    # --- Utilities ---
    "python-dotenv==1.0.1",
    "typer==0.12.3",
    "rich==13.7.1",
    "anyio==4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "black==24.4.2",
    "ruff==0.4.8",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "factory-boy==3.3.0",
    "Faker==25.3.0",
    "moto[s3]==5.0.9",
]

[project.scripts]
prometheus-api   = "prometheus.api.main:start"
prometheus-cli   = "prometheus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["prometheus"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["prometheus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=prometheus --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: marks tests requiring running services",
    "e2e: end-to-end tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
