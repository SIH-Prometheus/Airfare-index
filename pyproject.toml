[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prometheus"]


[project]
name = "prometheus-apix"
version = "0.1.0"
description = "Real-time Airfare Price Index (APIx) for India — SIH26056"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "SIH26056 Team" }]

dependencies = [
    "playwright>=1.48.0",
    "httpx==0.27.0",
    "tenacity==8.2.3",
    "pydantic>=2.9.0",
    "pydantic-settings==2.3.0",
    "fastapi==0.111.0",
    "sqlalchemy>=2.0.35",
    "asyncpg==0.30.0",
    "alembic==1.13.1",
    "pyarrow>=17.0.0",
    "redis==5.0.4",
    "structlog==24.2.0",
    "python-dotenv==1.0.1",
    "typer==0.12.3",
    "rich==13.7.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "prefect>=3.0.0",
    "email-validator>=2.1.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: marks tests as integration tests requiring services"]
